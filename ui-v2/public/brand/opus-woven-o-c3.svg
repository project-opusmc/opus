    <path id="woven-ring" fill-rule="evenodd" clip-rule="evenodd" d="M128 20C188 20 240 67 240 128C240 188 190 236 128 236C64 236 14 188 14 128C14 68 64 20 128 20ZM140 64C159 79 176 101 178 125C181 144 175 162 163 173C148 181 130 185 113 191C95 175 83 161 79 150C73 132 77 111 89 94C102 81 120 71 140 64Z"/>
