      <g fill="black" transform="translate(1.5 2)"><use href="#silver-front-a"/><use href="#silver-front-b"/></g>
    </mask>
    <mask id="blue-bottom-bevel" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
