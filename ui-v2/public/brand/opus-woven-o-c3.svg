    <use href="#woven-ring" transform="translate(3.75 5)"/>
    <use href="#woven-ring" transform="translate(3 4)"/>
    <use href="#woven-ring" transform="translate(2.25 3)"/>
    <use href="#woven-ring" transform="translate(1.5 2)"/>
    <use href="#woven-ring" transform="translate(.75 1)"/>
  </g>
