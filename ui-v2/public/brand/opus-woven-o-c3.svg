      <g fill="black" transform="translate(1.5 2)"><use href="#blue-front-a"/><use href="#blue-front-b"/></g>
    </mask>
    <mask id="silver-top-bevel" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
