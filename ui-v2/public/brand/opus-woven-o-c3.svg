      <path fill="url(#lower-cut)" d="M217 203C184 235 147 224 113 191L117 198C151 231 188 242 221 210Z"/>
    </g>
    <use href="#silver-front-a" fill="url(#silver-colour)"/>
    <use href="#silver-front-b" fill="url(#silver-colour)"/>
