      <stop offset=".51" stop-color="#737494"/>
      <stop offset=".69" stop-color="#39475E"/>
      <stop offset="1" stop-color="#283449"/>
    </linearGradient>
    <linearGradient id="blue-colour" gradientUnits="userSpaceOnUse" x1="18" y1="228" x2="232" y2="28">
      <stop stop-color="#536580"/>
      <stop offset=".16" stop-color="#7AA6C9"/>
      <stop offset=".29" stop-color="#91C5DE"/>
      <stop offset=".39" stop-color="#C9C3EE"/>
      <stop offset=".45" stop-color="#F4E4F8"/>
      <stop offset=".50" stop-color="#BECDED"/>
      <stop offset=".59" stop-color="#779ABC"/>
      <stop offset=".70" stop-color="#ADA7D9"/>
      <stop offset=".77" stop-color="#E9C1DA"/>
      <stop offset=".82" stop-color="#D2E5F5"/>
      <stop offset=".88" stop-color="#7A9EC4"/>
