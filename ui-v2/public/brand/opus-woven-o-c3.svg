      <stop offset=".30" stop-color="#EDE8FC"/>
      <stop offset=".39" stop-color="#C3B1E3"/>
      <stop offset=".46" stop-color="#B2C2DA"/>
      <stop offset=".53" stop-color="#F5EDFC"/>
      <stop offset=".60" stop-color="#EAC7DE"/>
      <stop offset=".67" stop-color="#BDCADE"/>
      <stop offset=".76" stop-color="#DDE7F5"/>
      <stop offset=".86" stop-color="#9AABC5"/>
      <stop offset="1" stop-color="#71849F"/>
    </linearGradient>
    <linearGradient id="side-colour" gradientUnits="userSpaceOnUse" x1="53" y1="64" x2="207" y2="246">
