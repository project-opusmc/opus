      <path d="M0 0H256V256H0Z" fill="url(#bevel-light)" mask="url(#silver-top-bevel)"/>
      <path d="M0 0H256V256H0Z" fill="url(#bevel-shade)" mask="url(#silver-bottom-bevel)"/>
    </g>
    <g id="cut-lips" stroke="url(#lip-light)" stroke-width=".9" stroke-linecap="round">
